site_name: UQ course

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/lightbulb-outline
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/lightbulb
        name: Switch to light mode

nav:
- Home: index.md
- 1. Introduction: lectures/index.md
- 2. Basics of probability and statistics: lectures/probability.md
- 3. Uncertainty quantification: lectures/uncertainty_quantification.md
- 4. Uncertainty propagation: lectures/uncertainty_propagation.md
- 5. Sensitivity analysis: lectures/sensitivity_analysis.md
- 6. Surrogate models: lectures/surrogate_models.md
- 7. Robust optimization: lectures/robust_optimization.md

plugins:
  - bibtex:
      bib_file: "docs/references.bib"

markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.arithmatex:
    generic: true
- pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
- footnotes
- toc:
    permalink: true
- pymdownx.snippets

extra_javascript:
- javascripts/mathjax.js
- https://polyfill.io/v3/polyfill.min.js?features=es6
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

use_directory_urls: false